
# ==========================================================
# TUVET - FRONTEND REACT + VITE
# AZURE APP SERVICE
# GitHub: DavidDutanSanchez/Front_TUVET
# Branch: main
# ==========================================================

name: Build and deploy Node.js app to Azure Web App - tuvet-front

on:
  push:
    branches:
      - main

  workflow_dispatch:

# ==========================================================
# BUILD
# ==========================================================

jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ----------------------------------------------------
      # OBTENER CODIGO
      # ----------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # CONFIGURAR NODE.JS
      # ----------------------------------------------------

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      # ----------------------------------------------------
      # CONFIGURAR YARN
      # ----------------------------------------------------

      - name: Enable Corepack
        run: corepack enable

      # ----------------------------------------------------
      # INSTALAR DEPENDENCIAS
      # ----------------------------------------------------

      - name: Install dependencies
        run: yarn install

      # ----------------------------------------------------
      # COMPILAR REACT + VITE
      # ----------------------------------------------------

      - name: Build TuVet Frontend

        env:
          VITE_BACKEND_URL: "https://181.113.129.250:22604"
          VITE_AUTH_PREFIX: "Bearer"

        run: |
          yarn build

      # ----------------------------------------------------
      # VALIDAR COMPILACION
      # ----------------------------------------------------

      - name: Verify build output

        run: |
          if [ ! -f dist/index.html ]; then
            echo "ERROR: No existe dist/index.html"
            exit 1
          fi

          echo "Frontend TuVet compilado correctamente"

          ls -la dist

      # ----------------------------------------------------
      # CREAR PAQUETE PARA AZURE APP SERVICE
      # ----------------------------------------------------

      - name: Prepare deployment package

        run: |
          mkdir -p deploy-package/public

          cp -R dist/. deploy-package/public/

          cat > deploy-package/package.json <<'EOF'
          {
            "name": "tuvet-azure",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "start": "node server.cjs"
            }
          }
          EOF

          cat > deploy-package/server.cjs <<'EOF'
          const http = require('http');
          const fs = require('fs');
          const path = require('path');

          const root = path.join(__dirname, 'public');

          const port = Number(process.env.PORT) || 8080;

          const mimeTypes = {
            '.html': 'text/html; charset=utf-8',
            '.js': 'text/javascript; charset=utf-8',
            '.css': 'text/css; charset=utf-8',
            '.json': 'application/json; charset=utf-8',
            '.png': 'image/png',
            '.jpg': 'image/jpeg',
            '.jpeg': 'image/jpeg',
            '.gif': 'image/gif',
            '.svg': 'image/svg+xml',
            '.ico': 'image/x-icon',
            '.webp': 'image/webp',
            '.woff': 'font/woff',
            '.woff2': 'font/woff2',
            '.txt': 'text/plain; charset=utf-8',
            '.xml': 'application/xml; charset=utf-8'
          };

          const server = http.createServer((req, res) => {

            if (req.method !== 'GET' && req.method !== 'HEAD') {
              res.writeHead(405);
              res.end('Method Not Allowed');
              return;
            }

            let pathname;

            try {
              pathname = decodeURIComponent(
                new URL(req.url, 'http://localhost').pathname
              );
            } catch {
              res.writeHead(400);
              res.end('Bad Request');
              return;
            }

            let requestedFile = path.resolve(
              root,
              '.' + pathname
            );

            const relative = path.relative(root, requestedFile);

            if (
              relative === '..' ||
              relative.startsWith('..' + path.sep) ||
              path.isAbsolute(relative)
            ) {
              res.writeHead(403);
              res.end('Forbidden');
              return;
            }

            if (
              fs.existsSync(requestedFile) &&
              fs.statSync(requestedFile).isDirectory()
            ) {
              requestedFile = path.join(
                requestedFile,
                'index.html'
              );
            }

            if (!fs.existsSync(requestedFile)) {

              const acceptsHtml = (
                req.headers.accept || ''
              ).includes('text/html');

              if (
                !acceptsHtml ||
                path.extname(pathname)
              ) {
                res.writeHead(404);
                res.end('Not Found');
                return;
              }

              requestedFile = path.join(
                root,
                'index.html'
              );
            }

            const extension = path.extname(requestedFile);

            const contentType =
              mimeTypes[extension] ||
              'application/octet-stream';

            res.writeHead(200, {
              'Content-Type': contentType
            });

            if (req.method === 'HEAD') {
              res.end();
              return;
            }

            fs.createReadStream(requestedFile)
              .pipe(res);

          });

          server.listen(port, '0.0.0.0', () => {
            console.log(
              'TuVet frontend running on port ' + port
            );
          });
          EOF

          echo "Paquete de despliegue preparado"

          ls -la deploy-package

      # ----------------------------------------------------
      # SUBIR PAQUETE
      # ----------------------------------------------------

      - name: Upload artifact for deployment

        uses: actions/upload-artifact@v4

        with:
          name: tuvet-frontend
          path: deploy-package/
          if-no-files-found: error

  # ========================================================
  # DEPLOY
  # ========================================================

  deploy:

    runs-on: ubuntu-latest

    needs: build

    permissions:
      id-token: write
      contents: read

    steps:

      # ----------------------------------------------------
      # DESCARGAR PAQUETE
      # ----------------------------------------------------

      - name: Download artifact

        uses: actions/download-artifact@v4

        with:
          name: tuvet-frontend
          path: .

      # ----------------------------------------------------
      # INICIAR SESION EN AZURE
      # ----------------------------------------------------

      - name: Login to Azure

        uses: azure/login@v2

        with:

          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3016692233E64E0BA77CFEEE9AB79ABF }}

          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_AAA53E4FB8A34741B79030CC6052C4B2 }}

          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1990006AB3CA4B4AAA6B1148C0EE0AB8 }}

      # ----------------------------------------------------
      # PUBLICAR EN AZURE APP SERVICE
      # ----------------------------------------------------

      - name: Deploy to Azure Web App

        id: deploy-to-webapp

        uses: azure/webapps-deploy@v3

        with:

          app-name: 'tuvet-front'

          slot-name: 'Production'

          package: .

      # ----------------------------------------------------
      # CERRAR SESION
      # ----------------------------------------------------

      - name: Logout from Azure

        if: always()

        run: |
          az logout || true
