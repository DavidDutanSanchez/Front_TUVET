
# ==========================================================
# TUVET - AZURE APP SERVICE
# Frontend React + Vite
# GitHub Actions - Rama main
# ==========================================================

name: Build and deploy Node.js app to Azure Web App - tuvet-front

on:
  push:
    branches:
      - main

  workflow_dispatch:

# ==========================================================
# BUILD
# ==========================================================

jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ----------------------------------------------------
      # OBTENER CODIGO DESDE GITHUB
      # ----------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # CONFIGURAR NODE.JS
      # ----------------------------------------------------

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      # ----------------------------------------------------
      # INSTALAR YARN
      # ----------------------------------------------------

      - name: Enable Corepack
        run: corepack enable

      # ----------------------------------------------------
      # INSTALAR DEPENDENCIAS
      # ----------------------------------------------------

      - name: Install dependencies
        run: yarn install

      # ----------------------------------------------------
      # COMPILAR FRONTEND TUVET
      # ----------------------------------------------------

      - name: Build TuVet Frontend

        env:
          VITE_BACKEND_URL: "https://181.113.129.250:22604"
          VITE_AUTH_PREFIX: "Bearer"

        run: |
          yarn build

      # ----------------------------------------------------
      # COMPROBAR QUE EXISTE DIST
      # ----------------------------------------------------

      - name: Verify build output

        run: |
          if [ ! -f dist/index.html ]; then
            echo "ERROR: No se genero dist/index.html"
            exit 1
          fi

          echo "Frontend TuVet compilado correctamente"

          ls -la dist

      # ----------------------------------------------------
      # PREPARAR ARCHIVOS PARA DESPLIEGUE
      # ----------------------------------------------------

      - name: Upload artifact for deployment job

        uses: actions/upload-artifact@v4

        with:
          name: node-app
          path: .
          include-hidden-files: false


  # ========================================================
  # DEPLOY
  # ========================================================

  deploy:

    runs-on: ubuntu-latest

    needs: build

    permissions:
      id-token: write
      contents: read

    environment:
      name: Production

    steps:

      # ----------------------------------------------------
      # DESCARGAR ARCHIVOS COMPILADOS
      # ----------------------------------------------------

      - name: Download artifact from build job

        uses: actions/download-artifact@v4

        with:
          name: node-app

      # ----------------------------------------------------
      # INICIAR SESION EN AZURE
      # ----------------------------------------------------

      - name: Login to Azure

        uses: azure/login@v2

        with:

          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3016692233E64E0BA77CFEEE9AB79ABF }}

          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_AAA53E4FB8A34741B79030CC6052C4B2 }}

          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1990006AB3CA4B4AAA6B1148C0EE0AB8 }}

          allow-no-subscriptions: true

      # ----------------------------------------------------
      # PUBLICAR EN AZURE APP SERVICE
      # ----------------------------------------------------

      - name: Deploy to Azure Web App

        id: deploy-to-webapp

        uses: azure/webapps-deploy@v3

        with:

          app-name: 'tuvet-front'

          slot-name: 'Production'

          package: .
